[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("webgpu"))'] }

[features]
default = []
big_space = ["dep:big_space"]
rand = ["dep:rand"]
metal_capture = []
bluenoise_texture = ["bevy/bluenoise_texture"]
atmosphere_example = ["bevy/free_camera", "bevy/https", "bevy/tonemapping_luts"]

[dependencies]
bevy = { git = "https://github.com/stuartparmenter/bevy", branch = "rtg-dev", default-features = false, features = ["3d"] }
big_space = { git = "https://github.com/mate-h/big_space", branch = "bevy-0.20", features = ["i32"], optional = true }
tiff = "0.10"
bytemuck = { version = "1.14", features = ["derive"] }
ndarray = "0.16.1"
itertools = "0.14.0"
indexmap = "2.12"
bitflags = "2.4"
serde = "1.0.210"
ron = "0.12"
async-channel = "2.1"
slab = "0.4.9"
strum = "0.27.1"
strum_macros = "0.27.1"

rand = { version = "0.9.0", optional = true }
# wgpu-core optional dep removed for Bevy 0.20 workspace compatibility; re-add with patched git when metal_capture is needed

[[example]]
name = "planar_world"
path = "examples/planar_world.rs"
required-features = ["atmosphere_example"]

[[example]]
name = "spherical"
path = "examples/spherical.rs"

[[example]]
name = "mount_baker"
path = "examples/mount_baker.rs"
required-features = ["atmosphere_example"]

[[example]]
name = "atmosphere"
path = "examples/atmosphere.rs"
required-features = ["atmosphere_example"]

[[example]]
name = "bc_atmosphere"
path = "examples/bc_atmosphere.rs"
required-features = ["atmosphere_example"]

[[example]]
name = "precision_demo"
path = "examples/precision_demo.rs"
required-features = ["rand"]

[patch.crates-io]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "a03be8d2232ad3507b69e431c02e483a5ea792d0" }
wgpu-types = { git = "https://github.com/gfx-rs/wgpu", rev = "a03be8d2232ad3507b69e431c02e483a5ea792d0" }
wgpu-naga-bridge = { git = "https://github.com/gfx-rs/wgpu", rev = "a03be8d2232ad3507b69e431c02e483a5ea792d0" }
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "a03be8d2232ad3507b69e431c02e483a5ea792d0" }

[dev-dependencies]
half = "2"
